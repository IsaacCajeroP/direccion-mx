<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Captura de Dirección · México</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="page">
    <div class="container">
      <div class="card form-card shadow-sm">
        <div class="card-body p-4 p-md-5">
          <h1 class="h3 mb-4">Dirección</h1>

          <div id="alert-container" aria-live="polite"></div>

          <form id="direccion-form" novalidate>
            <div class="mb-3">
              <label for="cp" class="form-label">Código Postal</label>
              <input
                type="text"
                class="form-control"
                id="cp"
                name="cp"
                inputmode="numeric"
                autocomplete="postal-code"
                maxlength="5"
                required
              />
              <div class="invalid-feedback" id="cp-feedback"></div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="estado" class="form-label">Estado</label>
                <select class="form-select" id="estado" name="estado" required disabled>
                  <option value="">Cargando...</option>
                </select>
                <div class="invalid-feedback">Selecciona un estado.</div>
              </div>
              <div class="col-md-6 mb-3">
                <label for="municipio" class="form-label">Municipio</label>
                <select class="form-select" id="municipio" name="municipio" required disabled>
                  <option value="">Seleccione el estado</option>
                </select>
                <div class="invalid-feedback">Selecciona un municipio.</div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="localidad" class="form-label">Localidad</label>
                <select class="form-select" id="localidad" name="localidad" required disabled>
                  <option value="">Seleccione el municipio...</option>
                </select>
                <div class="invalid-feedback">Selecciona una localidad.</div>
              </div>
              <div class="col-md-6 mb-3">
                <label for="colonia" class="form-label">Colonia</label>
                <select class="form-select" id="colonia" name="colonia" required disabled>
                  <option value="">Seleccione...</option>
                </select>
                <div class="invalid-feedback">Selecciona una colonia.</div>
              </div>
            </div>

            <div class="mb-4">
              <label for="calle" class="form-label">Calle y número</label>
              <input
                type="text"
                class="form-control"
                id="calle"
                name="calle"
                autocomplete="address-line1"
                required
              />
              <div class="invalid-feedback">Escribe la calle y número.</div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100" id="submit-btn">
              Continuar
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
